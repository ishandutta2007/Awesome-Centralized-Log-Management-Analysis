<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: rgba(148, 163, 184, 0.08); stroke-width: 1; }
    .stream-particle-1 { animation: streamMove 6s linear infinite; }
    .stream-particle-2 { animation: streamMove 8s linear infinite; animation-delay: -3s; }
    .stream-particle-3 { animation: streamMove 7s linear infinite; animation-delay: -1.5s; }
    .pulse-glow { animation: pulse 4s ease-in-out infinite alternate; }
    .float-badge { animation: floatSlow 5s ease-in-out infinite alternate; }
    
    @keyframes streamMove {
      0% { transform: translateX(0); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateX(850px); opacity: 0; }
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Orbs (in background) -->
  <g class="pulse-glow" style="transform-origin: 200px 100px;">
    <circle cx="220" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)" />
  </g>
  <g class="pulse-glow" style="transform-origin: 980px 240px; animation-delay: -2s;">
    <circle cx="980" cy="240" r="160" fill="#c084fc" opacity="0.1" filter="url(#glowPurple)" />
  </g>

  <!-- Geometric Grid Pattern -->
  <g class="grid-pattern">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="160" y1="0" x2="160" y2="360" class="grid-line" />
    <line x1="360" y1="0" x2="360" y2="360" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="360" class="grid-line" />
    <line x1="760" y1="0" x2="760" y2="360" class="grid-line" />
    <line x1="960" y1="0" x2="960" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Animated Log Pipelines / Stream Rays (Background flow) -->
  <g opacity="0.5">
    <path d="M 120 290 C 350 290, 500 240, 750 240 S 980 270, 1150 270" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="6,6" />
    <path d="M 80 320 C 300 320, 520 280, 800 280 S 1020 310, 1180 310" fill="none" stroke="rgba(192, 132, 252, 0.15)" stroke-width="2" stroke-dasharray="4,8" />
  </g>

  <!-- Moving Data Stream Particles -->
  <g>
    <circle cx="160" cy="290" r="4" fill="#38bdf8" class="stream-particle-1" />
    <circle cx="120" cy="320" r="3.5" fill="#c084fc" class="stream-particle-2" />
    <circle cx="200" cy="285" r="4.5" fill="#818cf8" class="stream-particle-3" />
  </g>

  <!-- Dynamic Feature Badges / Floating Pills (Right Side) -->
  <g class="float-badge" transform="translate(860, 55)">
    <!-- Pill 1: Ingestion -->
    <g transform="translate(0, 0)">
      <rect width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#38bdf8" />
      <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">⚡ High-Throughput Ingest</text>
    </g>

    <!-- Pill 2: Real-time Search -->
    <g transform="translate(20, 54)">
      <rect width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#818cf8" />
      <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🔍 Sub-Second Analytics</text>
    </g>

    <!-- Pill 3: Observability &amp; SIEM -->
    <g transform="translate(5, 108)">
      <rect width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#c084fc" />
      <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🛡️ SIEM &amp; Security Auditing</text>
    </g>

    <!-- Pill 4: S3 &amp; Object Tiering -->
    <g transform="translate(25, 162)">
      <rect width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#34d399" />
      <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">💾 Cost-Aware Tiered Storage</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Category Pills -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 68)">
    <rect width="275" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="14" y="19" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.8">🚀 OBSERVABILITY &amp; LOG ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title (Guaranteed foreground, clear of animated components) -->
  <g transform="translate(70, 142)">
    <text x="0" y="0" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">Centralized Log Management</text>
    <text x="0" y="46" font-size="40" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">&amp; Analytics Matrix</text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(70, 230)">
    <text x="0" y="0" font-size="17" fill="#94a3b8" font-weight="400">
      The definitive curated index of enterprise SaaS platforms and leading open-source engines
    </text>
    <text x="0" y="26" font-size="15" fill="#64748b" font-weight="400">
      Covering ingestion pipelines, full-text indexation, cold S3 tiering, SIEM, and pricing intelligence.
    </text>
  </g>

  <!-- Bottom Mini Badges -->
  <g transform="translate(70, 295)">
    <!-- SaaS tag -->
    <rect x="0" y="0" width="135" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="12" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600">☁️ SaaS Platforms</text>

    <!-- Open-Source tag -->
    <rect x="148" y="0" width="170" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="12" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600" transform="translate(148,0)">⚡ Open-Source Stacks</text>

    <!-- Pricing Insights tag -->
    <rect x="330" y="0" width="175" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="12" y="17" fill="#cbd5e1" font-size="11.5" font-weight="600" transform="translate(330,0)">💰 Pricing &amp; Star Matrix</text>
  </g>
</svg>